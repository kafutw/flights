*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 4px}
.note{color:var(--ink3);font-size:12px;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile .k{color:var(--ink2);font-size:13px}
.tile .v{font-size:28px;font-weight:700;letter-spacing:.5px;font-variant-numeric:tabular-nums}
.tile .d{color:var(--ink2);font-size:13px}
.up{color:var(--bad)}.down{color:var(--good)}

.chart{position:relative}
svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;
 padding:6px 10px;font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:2}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--grid);font-size:13px;white-space:nowrap}
th:first-child,td:first-child{text-align:left}

.scale span.sw{width:22px;height:10px;border-radius:2px;display:inline-block}

  const b = minBy[last][c], b0 = minBy[first][c];
  let d = '—'; if (b0 && runs.length > 1) { const x = (b.price - b0.price) * P; d = x < 0 ? `<span class="down">▼ ${fmt(-x)}</span>` : x > 0 ? `<span class="up">▲ ${fmt(x)}</span>` : '持平'; }
  t += `<tr><td>${name[c]}<span class="tag">${isL[c] ? '廉航' : '傳統'}</span></td><td>${fmt(b.price * P)}</td><td>${fmt(b.price)}</td>
    <td>${+b.dep.slice(5,7)}/${+b.dep.slice(8)}</td><td>${d}</td><td>${fmt(allMin[c] * P)}</td></tr>`;
});
$('tbl').innerHTML = t;

// ── 星宇（主要追蹤）
(function () {
  const F = D.focus, fr = [...new Set(F.map(r => r[0]))].sort();
  const md = d => `${+d.slice(5,7)}/${+d.slice(8)}`;
  if (!fr.length) { $('fnote').textContent = '下一輪掃描開始記錄星宇每一個班次的價格。'; $('ftbl').remove(); return; }
  const fl = fr[fr.length - 1], fp = fr.length > 1 ? fr[fr.length - 2] : null;
  const at = run => { const m = {}; F.filter(r => r[0] === run).forEach(([, d, t, p]) => ((m[d] ??= {})[t] = p)); return m; };
  const L = at(fl), Pv = fp ? at(fp) : {};
  const times = [...new Set(F.filter(r => r[0] === fl).map(r => r[2]))].sort();
  const ds = Object.keys(L).sort();
  const minOf = m => Math.min(...Object.values(m).flatMap(o => Object.values(o)));
  const now = minOf(L), prev = fp ? minOf(Pv) : null, ever = Math.min(...F.map(r => r[3]));
  let where = ''; ds.forEach(d => times.forEach(t => { if (L[d][t] === now && !where) where = `${md(d)} 去 ${t} 班`; }));
  const delta = (a, b) => b == null ? '—' : a < b ? `<span class="down">▼ ${fmt((b - a) * P)}</span>` : a > b ? `<span class="up">▲ ${fmt((a - b) * P)}</span>` : '持平';
  $('fnote').textContent = `最新一次掃描 ${fl.slice(5)}，每一格是「那天搭那個班次去」的 5 人來回估計（回程配最便宜的一班），單位：元。只列符合時間條件的班次（桃園⇄成田）。比上一輪便宜就會跳通知。`;
  $('ftiles').innerHTML = `<div class="tile"><div class="k">星宇現在最低（5 人）</div><div class="v">${fmt(now * P)}</div><div class="d">${where}・每人 ${fmt(now)}</div></div>
    <div class="tile"><div class="k">比上一輪</div><div class="v" style="font-size:22px">${delta(now, prev)}</div><div class="d">${fp ? fp.slice(5) + ' 那輪 ' + fmt(prev * P) : '還沒有上一輪'}</div></div>
    <div class="tile"><div class="k">追蹤以來最低（5 人）</div><div class="v">${fmt(ever * P)}</div><div class="d">開始記錄：${fr[0].slice(5)}</div></div>`;
  let h = '<tr><th>出發 → 回程</th>' + times.map(t => `<th>${t} 班</th>`).join('') + '</tr>';
  ds.forEach(d => {
    const back = new Date(d); back.setDate(back.getDate() + 6);
    h += `<tr><td>${md(d)} → ${back.getMonth() + 1}/${back.getDate()}</td>` + times.map(t => {
      const v = L[d][t]; if (!v) return '<td style="color:var(--ink3)">—</td>';
      const pv = (Pv[d] || {})[t]; const ch = pv && v !== pv ? ` <span class="${v < pv ? 'down' : 'up'}" style="font-size:11px">${v < pv ? '▼' : '▲'}${fmt(Math.abs(v - pv) * P)}</span>` : '';
      return `<td${v === now ? ' style="font-weight:700;outline:2px solid var(--s1);outline-offset:-2px"' : ''}>${fmt(v * P)}${ch}</td>`;
    }).join('') + '</tr>';
  });
  $('ftbl').innerHTML = h;
})();

// ── 新聞
$('news').innerHTML = D.news.length ? D.news.map(n => `<li><span class="dt">${n.found || ''}</span><a href="${n.link}" target="_blank" rel="noopener">${n.title.replace(/</g,'&lt;')}</a></li>`).join('')
  : '<li style="color:var(--ink3)">還沒有新的。</li>';
</script></body></html>
